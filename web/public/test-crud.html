<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تست CRUD</title>
    <style>
        body { font-family: Tahoma; padding: 20px; background: #1a1a2e; color: #eee; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; background: #16213e; color: #fff; border: 1px solid #0f3460; border-radius: 5px; }
        button:hover { background: #0f3460; }
        pre { background: #16213e; padding: 15px; border-radius: 5px; overflow: auto; }
        .success { color: #4ecca3; }
        .error { color: #ff6b6b; }
    </style>
</head>
<body>
    <h1>🧪 تست CRUD Operations</h1>
    
    <div>
        <button onclick="testCreate()">1️⃣ Create - ایجاد</button>
        <button onclick="testRead()">2️⃣ Read - خواندن</button>
        <button onclick="testUpdate()">3️⃣ Update - بروزرسانی</button>
        <button onclick="testDelete()">4️⃣ Delete - حذف</button>
        <button onclick="clearLog()">🗑️ پاک کردن</button>
    </div>
    
    <div id="log"></div>
    
    <script>
        let currentTaskId = null;
        
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const className = type === 'success' ? 'success' : type === 'error' ? 'error' : '';
            logDiv.innerHTML += `<div class="${className}">${message}</div>`;
        }
        
        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }
        
        async function testCreate() {
            log('<h3>📝 تست Create...</h3>');
            try {
                const data = {
                    title: 'تسک تستی از HTML',
                    description: 'این تسک از طریق صفحه تست ایجاد شد',
                    projectId: 1,
                    progressPercent: 0
                };
                
                const response = await fetch('/api/tasks', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    currentTaskId = result.taskId;
                    log(`✅ تسک ایجاد شد!`, 'success');
                    log(`<pre>${JSON.stringify(result, null, 2)}</pre>`);
                } else {
                    log(`❌ خطا: ${result.error}`, 'error');
                    log(`<pre>${JSON.stringify(result, null, 2)}</pre>`);
                }
            } catch (error) {
                log(`❌ خطای شبکه: ${error.message}`, 'error');
            }
        }
        
        async function testRead() {
            log('<h3>📖 تست Read...</h3>');
            try {
                const response = await fetch('/api/tasks?pageSize=5');
                const result = await response.json();
                
                log(`✅ تعداد کل: ${result.total}`, 'success');
                log(`<pre>${JSON.stringify(result.rows.slice(0, 2), null, 2)}</pre>`);
            } catch (error) {
                log(`❌ خطا: ${error.message}`, 'error');
            }
        }
        
        async function testUpdate() {
            if (!currentTaskId) {
                log('⚠️ ابتدا یک تسک ایجاد کنید', 'error');
                return;
            }
            
            log('<h3>✏️ تست Update...</h3>');
            try {
                const data = {
                    title: 'تسک بروز شده',
                    progressPercent: 75,
                    statusCode: 'In Progress'
                };
                
                const response = await fetch(`/api/tasks/${currentTaskId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    log(`✅ ${result.message}`, 'success');
                } else {
                    log(`❌ خطا: ${result.error}`, 'error');
                }
                log(`<pre>${JSON.stringify(result, null, 2)}</pre>`);
            } catch (error) {
                log(`❌ خطا: ${error.message}`, 'error');
            }
        }
        
        async function testDelete() {
            if (!currentTaskId) {
                log('⚠️ ابتدا یک تسک ایجاد کنید', 'error');
                return;
            }
            
            log('<h3>🗑️ تست Delete...</h3>');
            try {
                const response = await fetch(`/api/tasks/${currentTaskId}`, {
                    method: 'DELETE'
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    log(`✅ ${result.message}`, 'success');
                    currentTaskId = null;
                } else {
                    log(`❌ خطا: ${result.error}`, 'error');
                }
                log(`<pre>${JSON.stringify(result, null, 2)}</pre>`);
            } catch (error) {
                log(`❌ خطا: ${error.message}`, 'error');
            }
        }
    </script>
</body>
</html>
